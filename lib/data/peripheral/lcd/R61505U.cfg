.name r61505u
.descr Renesas R61505U extensions to the ILI9320-compatible register map

DISPLAY_CONTROL_1		0x07	Display control 1 extension
	VON			6	1	VCOM output enable

POWER_CONTROL_3			0x12	Power control 3 extension
	PSON			5	1	Internal power supply operation enable

POWER_CONTROL_5			0x17	Power supply startup control
	PSE			0	1	Power supply startup enable

GAMMA_33				0x33	Gamma control 4
	VALUE			0	16	Raw gamma value
GAMMA_34				0x34	Gamma control 5
	VALUE			0	16	Raw gamma value
GAMMA_3A				0x3A	Gamma control 11
	VALUE			0	16	Raw gamma value
GAMMA_3B				0x3B	Gamma control 12
	VALUE			0	16	Raw gamma value

CALIBRATION_CONTROL		0xA4	NVM calibration control
	CALB			0	1	Load NVM data and calibrate the oscillator
