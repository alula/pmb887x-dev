.name ili9320
.descr Ilitek ILI9320 TFT LCD controller

OSCILLATION			0x00		Oscillator startup and device-code access
	OSC			0	1	Internal oscillator enable

DRIVER_OUTPUT_CONTROL	0x01	Source shift direction and gate scan arrangement
	SS			8	1	Source output shift direction
	SM			10	1	Gate driver pin arrangement

LCD_DRIVING_CONTROL		0x02	LCD AC-drive waveform selection
	EOR			8	1	Frame and line inversion XOR control
	B_C			9	1	Frame or line inversion selection

ENTRY_MODE				0x03	MPU format, color order, and GRAM address update
	AM			3	1	Address counter update axis
	ID			4	2	Horizontal and vertical address directions
	ORG			7	1	Window origin relocation enable
	HWM			9	1	High-speed GRAM write enable
	BGR			12	1	Source RGB component order
	DFM			14	1	262k-color transfer arrangement
	TRI			15	1	262k-color transfer enable

RESIZE_CONTROL			0x04	GRAM write resizing control
	RSZ			0	2	Image resizing factor
	RCH			4	2	Horizontal remainder pixel count
	RCV			8	2	Vertical remainder pixel count

DISPLAY_CONTROL_1		0x07	Display, partial image, and gate output control
	D			0	2	Display operating state
	CL			3	1	Eight-color display mode enable
	DTE			4	1	Display timing enable
	GON			5	1	Gate output enable
	BASEE		8	1	Base image display enable
	PTDE			12	2	Partial image enables

DISPLAY_CONTROL_2		0x08	Vertical front and back porch timing
	BP			0	4	Vertical back porch in lines
	FP			8	4	Vertical front porch in lines

DISPLAY_CONTROL_3		0x09	Non-display scan and source output control
	ISC			0	4	Interval scan cycle
	PTG			4	2	Non-display gate scan mode
	PTS			8	3	Non-display source output level

DISPLAY_CONTROL_4		0x0A	Frame-marker output control
	FMI			0	3	Frame-marker output interval
	FMARKOE		3	1	Frame-marker output enable

RGB_INTERFACE_CONTROL_1	0x0C	GRAM interface and display synchronization source
	RIM			0	2	RGB interface width
	DM			4	2	Display synchronization source
	RM			8	1	GRAM access interface
	ENC			13	3	RGB-interface GRAM write cycle

FRAME_MARKER			0x0D	Frame-marker output position
	FMP			0	9	Frame-marker output line

RGB_INTERFACE_CONTROL_2	0x0F	External display-signal polarities
	DPL			0	1	DOTCLK sampling edge
	EPL			1	1	ENABLE active polarity
	HSPL			3	1	HSYNC active polarity
	VSPL			4	1	VSYNC active polarity

POWER_CONTROL_1			0x10	Step-up circuits, amplifiers, and standby control
	SLP			1	1	Sleep mode enable
	DSTB			2	1	Deep standby enable
	AP			4	3	Operational-amplifier drive current
	APE			7	1	Power supply enable
	BT			8	4	Step-up circuit factors
	SAP			12	1	Source driver output enable

POWER_CONTROL_2			0x11	Step-up clocks and VCI reference control
	VC			0	3	VCI reference voltage ratio
	DC0			4	3	Step-up circuit 1 frequency
	DC1			8	3	Step-up circuit 2 frequency

POWER_CONTROL_3			0x12	VGL, VREG1OUT, and VCOM reference control
	VRH			0	4	VREG1OUT amplification ratio
	PON			4	1	VGL output enable
	VCMR			8	1	Internal VCOMH adjustment enable

POWER_CONTROL_4			0x13	VCOM alternating amplitude control
	VDV			8	5	VCOM alternating amplitude

GRAM_X					0x20	GRAM horizontal address
	AD			0	8	Horizontal address counter value

GRAM_Y					0x21	GRAM vertical address
	AD			0	9	Vertical address counter value

GRAM_DATA				0x22	Interface-formatted GRAM pixel access
	DATA			0	18	Display pixel data

POWER_CONTROL_7			0x29	Internal VCOMH voltage control
	VCM			0	5	VCOMH voltage ratio

FRAME_RATE_CONTROL		0x2B	Internal oscillator and frame-rate control
	FR_SEL			4	2	Internal oscillator frame rate
	EXT_R			7	1	External oscillator resistor enable

GAMMA_30				0x30	Gamma control 1
	VALUE			0	16	Raw gamma value
GAMMA_31				0x31	Gamma control 2
	VALUE			0	16	Raw gamma value
GAMMA_32				0x32	Gamma control 3
	VALUE			0	16	Raw gamma value
GAMMA_35				0x35	Gamma control 4
	VALUE			0	16	Raw gamma value
GAMMA_36				0x36	Gamma control 5
	VALUE			0	16	Raw gamma value
GAMMA_37				0x37	Gamma control 6
	VALUE			0	16	Raw gamma value
GAMMA_38				0x38	Gamma control 7
	VALUE			0	16	Raw gamma value
GAMMA_39				0x39	Gamma control 8
	VALUE			0	16	Raw gamma value
GAMMA_3C				0x3C	Gamma control 9
	VALUE			0	16	Raw gamma value
GAMMA_3D				0x3D	Gamma control 10
	VALUE			0	16	Raw gamma value

WINDOW_X_START			0x50	Horizontal GRAM window start
	HSA			0	8	Horizontal start address

WINDOW_X_END			0x51	Horizontal GRAM window end
	HEA			0	8	Horizontal end address

WINDOW_Y_START			0x52	Vertical GRAM window start
	VSA			0	9	Vertical start address

WINDOW_Y_END			0x53	Vertical GRAM window end
	VEA			0	9	Vertical end address

GATE_SCAN				0x60	Gate scan direction, line count, and start position
	SCN			0	6	Gate scan start position
	NL			8	6	Driven LCD line count
	GS			15	1	Gate output shift direction

BASE_IMAGE				0x61	Base image polarity and scrolling control
	REV			0	1	Grayscale inversion enable
	VLE			1	1	Vertical scrolling enable
	NDL			2	1	Non-display source output level

VERTICAL_SCROLL			0x6A	Base image vertical scroll offset
	VL			0	9	Vertical scroll amount

PARTIAL_1_POSITION		0x80	Partial image 1 display position
	PTDP			0	9	Display start line
PARTIAL_1_START			0x81	Partial image 1 GRAM start line
	PTSA			0	9	GRAM start line
PARTIAL_1_END			0x82	Partial image 1 GRAM end line
	PTEA			0	9	GRAM end line
PARTIAL_2_POSITION		0x83	Partial image 2 display position
	PTDP			0	9	Display start line
PARTIAL_2_START			0x84	Partial image 2 GRAM start line
	PTSA			0	9	GRAM start line
PARTIAL_2_END			0x85	Partial image 2 GRAM end line
	PTEA			0	9	GRAM end line

PANEL_INTERFACE_1		0x90	Internal-clock line timing
	RTNI			0	5	Internal 1H clock-cycle count
	DIVI			8	2	Internal oscillator division ratio

PANEL_INTERFACE_2		0x92	Internal-clock gate non-overlap timing
	NOWI			8	3	Gate non-overlap period

PANEL_INTERFACE_3		0x93	Internal-clock source output timing
	MCPI			0	3	Source output position

PANEL_INTERFACE_4		0x95	External-DOTCLK line timing
	RTNE			0	6	External 1H clock-cycle count
	DIVE			8	2	DOTCLK division ratio

PANEL_INTERFACE_5		0x97	External-clock gate non-overlap timing
	NOWE			8	4	Gate non-overlap period

PANEL_INTERFACE_6		0x98	External-clock source output timing
	MCPE			0	3	Source output position
